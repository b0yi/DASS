services:
  traefik-pki:
    image: alpine:3.20
    command:
      - sh
      - -c
      - apk add --no-cache openssl >/dev/null && sh /scripts/bootstrap-traefik-pki.sh /pki
    volumes:
      - ./infra/traefik:/scripts:ro
      - ./infra/traefik/pki:/pki
    restart: "no"
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: traefik-pki

  traefik:
    image: traefik:v3.1
    depends_on:
      traefik-pki:
        condition: service_completed_successfully
    command:
      - --api.dashboard=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=:8443
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --log.level=INFO
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./infra/traefik/pki:/etc/traefik/pki:ro
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: traefik

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dass
      POSTGRES_USER: dass
      POSTGRES_PASSWORD: dass
    ports:
      - "5432:5432"
    volumes:
      - dass-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-primary:/docker-entrypoint-initdb.d # 把腳本資料夾對應到 Docker 內部的初始化目錄
    command: postgres -c max_connections=100 -c shared_buffers=256MB # 主庫上限 100 條連線（直連的 scheduler + 經 pgbouncer 匯流的 api/worker 都收斂在這之下）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dass -d dass"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: postgres

  postgres-replica:
    image: postgres:16-alpine
    # 關鍵：不用官方的開機流程，改用我們寫的影子腳本開機
    entrypoint: ["/init-script/entrypoint-replica.sh"]
    environment:
      POSTGRES_DB: dass
      POSTGRES_USER: dass
      POSTGRES_PASSWORD: dass
    volumes:
      # 掛載副本自己的永久硬碟
      - dass-replica-data:/var/lib/postgresql/data
      # 把 entrypoint 腳本資料夾掛載進去
      - ./infra/postgres/init-replica:/init-script
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: postgres-replica
    
  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer # 放棄去網路拉取，改由本地剛剛寫的 Dockerfile 直接編譯
    container_name: dass-pgbouncer
    # 設定全部在 pgbouncer.ini（Dockerfile.pgbouncer 直接 COPY 進 image 並以它啟動）。
    # alpine 的 pgbouncer 套件不會讀 PGBOUNCER_* / DATABASE_URL 這類環境變數——之前那些
    # env 完全沒作用、只是擺好看的。要改 pool 大小/模式請改 pgbouncer.ini。
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dass-net

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEBUG: "0"
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d
      - dass-localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -qE '\"sqs\":\\s*\"(running|available)\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: localstack

  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DASS_DATABASE_URL: ${DASS_DATABASE_URL:-postgresql+psycopg://dass:dass@pgbouncer:6432/dass} # 重新定向：埠改打 pgbouncer:6432
      DASS_REPLICA_DATABASE_URL: ${DASS_REPLICA_DATABASE_URL:-postgresql+psycopg://dass:dass@postgres-replica:5432/dass}
      DASS_SQS_ENDPOINT_URL: ${DASS_SQS_ENDPOINT_URL:-http://localstack:4566}
      DASS_WORKER_ID: ${DASS_WORKER_ID:-api-server}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      pgbouncer:
        condition: service_started # 確保代理大廳開門了
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: api-server
      traefik.enable: "true"
      traefik.docker.network: dass-net
      traefik.http.routers.api.rule: Host(`localhost`, `127.0.0.1`) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/metrics`) || Path(`/docs`) || Path(`/redoc`) || Path(`/openapi.json`))
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.priority: "100"
      traefik.http.routers.api.service: api-server
      traefik.http.routers.api.tls: "true"
      traefik.http.services.api-server.loadbalancer.server.port: "8000"
      traefik.http.services.api-server.loadbalancer.healthcheck.path: /health
      traefik.http.services.api-server.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.api-server.loadbalancer.healthcheck.timeout: 3s

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.scheduler
    env_file:
      - .env
    environment:
      # Scheduler 直連 Postgres：pg_advisory_lock 是 session 級鎖，走 pgbouncer
      # transaction pooling 會在交易結束時把連線還池、鎖跟著飄走，leader 選舉就壞了。
      DASS_DATABASE_URL: ${DASS_DATABASE_URL:-postgresql+psycopg://dass:dass@postgres:5432/dass}
      DASS_REPLICA_DATABASE_URL: ${DASS_REPLICA_DATABASE_URL:-postgresql+psycopg://dass:dass@postgres-replica:5432/dass}
      DASS_SQS_ENDPOINT_URL: ${DASS_SQS_ENDPOINT_URL:-http://localstack:4566}
      DASS_WORKER_ID: ${DASS_WORKER_ID:-scheduler}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      pgbouncer:
        condition: service_started # 確保代理大廳開門了
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: scheduler

  autoscaler:
    build:
      context: ./backend
      dockerfile: Dockerfile.scheduler
    command: ["python", "-m", "app.cli", "autoscaler"]
    env_file:
      - .env
    environment:
      DASS_DATABASE_URL: ${DASS_DATABASE_URL:-postgresql+psycopg://dass:dass@pgbouncer:6432/dass} # 重新定向：埠改打 pgbouncer:6432
      DASS_REPLICA_DATABASE_URL: ${DASS_REPLICA_DATABASE_URL:-postgresql+psycopg://dass:dass@postgres-replica:5432/dass}
      DASS_SQS_ENDPOINT_URL: ${DASS_SQS_ENDPOINT_URL:-http://localstack:4566}
      DASS_WORKER_ID: ${DASS_WORKER_ID:-autoscaler}
    # S5: VMService spawns sibling worker containers via host docker daemon.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: autoscaler

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DASS_DATABASE_URL: ${DASS_DATABASE_URL:-postgresql+psycopg://dass:dass@pgbouncer:6432/dass} # 重新定向：埠改打 pgbouncer:6432
      DASS_REPLICA_DATABASE_URL: ${DASS_REPLICA_DATABASE_URL:-postgresql+psycopg://dass:dass@postgres-replica:5432/dass}
      DASS_SQS_ENDPOINT_URL: ${DASS_SQS_ENDPOINT_URL:-http://localstack:4566}
      DASS_WORKER_ID: ${DASS_WORKER_ID:-worker}
      DASS_DOCKER_NETWORK: dass_dass-net # compose 專案名是 dass → 實際網路 dass_dass-net
    # S4: worker 透過 host docker daemon 起 job container；需要把 docker.sock mount 進來。
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DASS_BACKEND_URL: ${DASS_BACKEND_URL:-http://api-server:8000}
    depends_on:
      api-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: frontend
      traefik.enable: "true"
      traefik.docker.network: dass-net
      traefik.http.routers.frontend.rule: Host(`localhost`, `127.0.0.1`) && PathPrefix(`/`)
      traefik.http.routers.frontend.entrypoints: websecure
      traefik.http.routers.frontend.priority: "1"
      traefik.http.routers.frontend.service: frontend
      traefik.http.routers.frontend.tls: "true"
      traefik.http.services.frontend.loadbalancer.server.port: "3000"
      traefik.http.services.frontend.loadbalancer.healthcheck.path: /
      traefik.http.services.frontend.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.frontend.loadbalancer.healthcheck.timeout: 3s

volumes:
  dass-postgres-data:
  dass-replica-data:      # 副本的硬碟
  dass-localstack-data:

networks:
  dass-net:
    driver: bridge
