http:
  routers:
    api:
      rule: (Host(`dass.localhost`) || Host(`127.0.0.1`)) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/metrics`) || Path(`/docs`) || Path(`/redoc`) || Path(`/openapi.json`))
      entryPoints:
        - websecure
      priority: 100
      service: api-server
      tls: {}
    frontend:
      rule: (Host(`dass.localhost`) || Host(`127.0.0.1`)) && PathPrefix(`/`)
      entryPoints:
        - websecure
      priority: 1
      service: frontend
      tls: {}

  services:
    api-server:
      loadBalancer:
        servers:
          - url: http://api-server:8000
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3000
        healthCheck:
          path: /
          interval: 10s
          timeout: 3s
