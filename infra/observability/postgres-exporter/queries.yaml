# Application-level Postgres metrics for DASS. Joined with system-level metrics
# from postgres_exporter's defaults (connections, transactions, etc.).

dass_tasks_by_status:
  query: |
    SELECT status, count(*)::float AS count
    FROM tasks
    GROUP BY status
  master: true
  metrics:
    - status:
        usage: "LABEL"
        description: "Task status"
    - count:
        usage: "GAUGE"
        description: "Number of tasks currently in this status"

dass_tasks_recent_throughput:
  query: |
    SELECT
      COALESCE(SUM(CASE WHEN status='success' AND finished_at > NOW() - INTERVAL '1 minute' THEN 1 ELSE 0 END), 0)::float AS success_per_min,
      COALESCE(SUM(CASE WHEN status IN ('failed','final_failed') AND finished_at > NOW() - INTERVAL '1 minute' THEN 1 ELSE 0 END), 0)::float AS failed_per_min
    FROM tasks
  master: true
  metrics:
    - success_per_min:
        usage: "GAUGE"
        description: "Tasks succeeded in the last minute"
    - failed_per_min:
        usage: "GAUGE"
        description: "Tasks failed (including final_failed) in the last minute"

# Cumulative, monotonically-increasing task counters.
#
# Why these exist: every other task metric here is a GAUGE — a point-in-time
# snapshot sampled every few seconds. A short task (e.g. `echo hello` finishes
# in ~200ms) lives in the pending/running/in-flight state for far less than one
# scrape interval, so the snapshot almost always reads 0 and the task leaves no
# trace on the dashboard. These counters only ever go up, so even a 200ms task
# leaves a permanent +1 step in the time series. Derive throughput in Grafana
# with increase()/rate() — that reliably captures every task regardless of how
# fast it ran. Tasks are never deleted (retries insert new rows), so the values
# are genuinely monotonic and safe to expose as COUNTER.
dass_tasks:
  query: |
    SELECT
      count(*)::float AS created_total,
      COALESCE(SUM(CASE WHEN status = 'success' THEN 1 ELSE 0 END), 0)::float AS succeeded_total,
      COALESCE(SUM(CASE WHEN status IN ('failed', 'final_failed') THEN 1 ELSE 0 END), 0)::float AS failed_total,
      COALESCE(SUM(CASE WHEN retry_count > 0 THEN 1 ELSE 0 END), 0)::float AS retried_total,
      COALESCE(SUM(CASE WHEN status = 'final_failed' THEN 1 ELSE 0 END), 0)::float AS final_failed_total
    FROM tasks
  master: true
  metrics:
    - created_total:
        usage: "COUNTER"
        description: "Cumulative tasks ever created — 1 task == 1 enqueue (includes retries)"
    - succeeded_total:
        usage: "COUNTER"
        description: "Cumulative tasks that reached status=success"
    - failed_total:
        usage: "COUNTER"
        description: "Cumulative tasks that reached status in (failed, final_failed)"
    - retried_total:
        usage: "COUNTER"
        description: "Cumulative retry attempts (tasks with retry_count > 0 — i.e. a re-enqueue of a previously-failed task)"
    - final_failed_total:
        usage: "COUNTER"
        description: "Cumulative tasks that exhausted max_retries (status=final_failed)"

dass_jobs_total:
  query: "SELECT count(*)::float AS count FROM jobs"
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Total jobs"

dass_jobs_by_enabled:
  query: |
    SELECT enabled::text AS enabled, job_type, count(*)::float AS count
    FROM jobs
    GROUP BY enabled, job_type
  master: true
  metrics:
    - enabled:
        usage: "LABEL"
    - job_type:
        usage: "LABEL"
        description: "Job type (scheduled = cron-driven; normal = on-demand/manual)"
    - count:
        usage: "GAUGE"
        description: "Jobs by enabled flag and job_type"

# Cumulative tasks split by how they were triggered (manual /trigger vs scheduler).
# A scheduled task is enqueued + consumed in well under one scrape interval, so the
# SQS 'visible' gauge for dass-tasks-scheduled almost always reads 0. This COUNTER
# instead leaves a permanent +1 step per dispatch — use it (raw or increase()) to
# see "one scheduled dispatch == one tick".
dass_tasks_by_trigger:
  query: |
    SELECT trigger_type, count(*)::float AS total
    FROM tasks
    GROUP BY trigger_type
  master: true
  metrics:
    - trigger_type:
        usage: "LABEL"
        description: "How the task was triggered (manual / scheduled)"
    - total:
        usage: "COUNTER"
        description: "Cumulative tasks ever created with this trigger_type"

# Scheduler「目前手上、還沒到點」的 job 數：enabled 的 scheduled job 中，next_fire_at
# 仍在現在或未來（>= NOW()）。這就是排程器 heap 裡『已武裝、等著被觸發』的 job 數量。
# 穩態下每個 enabled scheduled job 觸發後 next_fire_at 會被重算到下一個 cron 時間（未來），
# 所以這個數 ≈ 由排程器管的 scheduled job 數；只有當排程器落後 / job 剛 enable 還沒算下次時間
# 時才會把 next_fire_at < NOW() 的『逾期』job 排除掉。GAUGE，當『目前快照』用。
dass_scheduler_jobs_upcoming:
  query: |
    SELECT count(*)::float AS count
    FROM jobs
    WHERE enabled = true
      AND job_type = 'scheduled'
      AND next_fire_at IS NOT NULL
      AND next_fire_at >= NOW()
  master: true
  metrics:
    - count:
        usage: "GAUGE"
        description: "Enabled scheduled jobs armed in the scheduler (next_fire_at >= now)"

# 「目前真的還在系統裡」的 task 數，依『實際被送進哪個佇列』分桶（normal / retry / scheduled）。
# 為什麼不用 SQS 的 visible/not_visible：scheduled task 在一個 scrape interval 內就被消化掉，
# SQS gauge 幾乎永遠讀 0，看不出真實負載。這裡直接從 DB 數 pending(等待中) / running(執行中)，
# 才是『目前確切的 job 數』而非積壓。
# 分桶規則（依實際 send_task 去向，互斥、有優先序）：
#   1. retry_count > 0            → retry queue（被重試 re-enqueue 到 retry queue，準確）
#   2. trigger_type='scheduled' 且 job 為 scheduled → scheduled queue（排程器週期派發）
#   3. 其餘                        → normal queue（手動 /trigger + normal job 建立即發）
# 註：normal job 建立時自動發射雖然 trigger_type 標成 'scheduled'，但因 job_type='normal'，
#     會正確落在 normal 桶。分桶無法 100% 還原物理佇列（DB 沒存佇列名），但這是最佳近似。
# 用 buckets CROSS JOIN 補 0，確保三個佇列 × pending/running 永遠各有一條線（即使閒置為 0），
# 維持原本 SQS 面板「三條 per-queue 折線 + lastNotNull/max 統計」的呈現。
dass_tasks_active_by_queue:
  query: |
    WITH buckets AS (
      SELECT q.queue, s.status
      FROM (VALUES ('normal'), ('retry'), ('scheduled')) AS q(queue)
      CROSS JOIN (VALUES ('pending'), ('running')) AS s(status)
    ),
    counts AS (
      SELECT
        CASE
          WHEN t.retry_count > 0 THEN 'retry'
          WHEN t.trigger_type = 'scheduled' AND j.job_type = 'scheduled' THEN 'scheduled'
          ELSE 'normal'
        END AS queue,
        t.status,
        count(*)::float AS count
      FROM tasks t
      JOIN jobs j ON j.id = t.job_id
      WHERE t.status IN ('pending', 'running')
      GROUP BY 1, t.status
    )
    SELECT b.queue, b.status, COALESCE(c.count, 0)::float AS count
    FROM buckets b
    LEFT JOIN counts c ON c.queue = b.queue AND c.status = b.status
  master: true
  metrics:
    - queue:
        usage: "LABEL"
        description: "Logical queue the task was routed to (normal / retry / scheduled)"
    - status:
        usage: "LABEL"
        description: "Task status (pending = waiting, running = in-flight)"
    - count:
        usage: "GAUGE"
        description: "Tasks currently in this (queue, status) — live count from DB, not SQS backlog"

# 2D 交叉：job 的型別 × task 的觸發來源（JOIN jobs）。讓「scheduled job 被 trigger-now」
# (job_type=scheduled, trigger_type=manual) 能跟「一般手動觸發 normal job」
# (job_type=normal, trigger_type=manual) 分開計數。GAUGE：因 FK 是 ON DELETE CASCADE，
# 刪 job 時對應 task 會一起消失（數字會掉），所以當「目前快照」用、不當嚴格 counter。
dass_tasks_by_job_and_trigger:
  query: |
    SELECT j.job_type, t.trigger_type, count(*)::float AS count
    FROM tasks t JOIN jobs j ON j.id = t.job_id
    GROUP BY j.job_type, t.trigger_type
  master: true
  metrics:
    - job_type:
        usage: "LABEL"
        description: "Owning job's type (normal / scheduled)"
    - trigger_type:
        usage: "LABEL"
        description: "How this run was triggered (manual / scheduled)"
    - count:
        usage: "GAUGE"
        description: "Task runs by (job_type, trigger_type) for still-existing jobs"
